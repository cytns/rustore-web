<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Витрина топ-приложений</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="header">
        <img class="logo" src="{{ url_for('static', filename='rustore-logo.svg') }}" alt="RuStore">
        <a class="button" href="https://www.rustore.ru/catalog/all">Перейти в оригинальный RuStore</a>
    </header>

    <main>
        <h1>Витрина топ-приложений</h1>
        <div class="apps">
            {% for app in apps %}
            <a class="card" href="{{ app.url }}">
                <h2>{{ app.name }}</h2>
                <p>{{ app.category }}</p>
                <span>Открыть в RuStore →</span>
            </a>
            {% endfor %}
        </div>
    </main>

    <footer>Сделано в рамках практического проекта</footer>
</body>
</html>
