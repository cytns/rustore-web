<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Витрина приложений</title>
</head>
<body>
    <h1>Витрина приложений</h1>
    <p>Подборка приложений из RuStore</p>

    <h2>Приложения</h2>
    <ul>
        {% for app in apps %}
        <li><a href="{{ app.url }}">{{ app.name }}</a> - {{ app.category }}</li>
        {% endfor %}
    </ul>
</body>
</html>
